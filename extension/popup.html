<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chrome Tabs Bridge</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="brand-row">
        <div class="brand">
          <img class="brand-mark" src="icons/icon-48.png" width="40" height="40" alt="">
          <div>
            <h1>Chrome Tabs</h1>
            <p>Alfred bridge</p>
          </div>
        </div>
        <span class="version" id="version">v—</span>
      </header>

      <section class="status-card" id="status-card" data-tone="progress">
        <div class="bridge-status" role="status" aria-live="polite" aria-atomic="true">
          <div class="status-heading">
            <span class="status-dot" aria-hidden="true"></span>
            <strong id="status-label">Connecting…</strong>
          </div>
          <p id="status-detail">Connecting to the native messaging host…</p>
          <button class="retry-button" id="retry" type="button" hidden>Retry connection</button>
        </div>

        <div class="divider" aria-hidden="true"></div>

        <div class="feature-row">
          <div class="feature-copy">
            <strong>History search</strong>
            <span id="history-detail">Checking Chrome permission</span>
          </div>
          <button class="permission-button" id="history-permission" type="button" data-tone="progress" aria-describedby="history-detail">Checking…</button>
        </div>
      </section>

      <footer>
        <a href="https://github.com/wilsonyiyi/alfred-chrome-tabs#chrome-tabs" target="_blank" rel="noreferrer">Documentation</a>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
