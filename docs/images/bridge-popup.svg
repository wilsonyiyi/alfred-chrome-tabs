<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title description">
  <title id="title">Chrome Tabs Bridge popup</title>
  <desc id="description">A compact Chrome Tabs extension popup showing a connected bridge, enabled History search, version information, and a GitHub repository link.</desc>
  <defs>
    <linearGradient id="mark-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="terminal-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#eef2f7"/>
  <g filter="url(#shadow)">
    <rect x="40" y="28" width="640" height="344" rx="17" fill="#ffffff"/>
  </g>

  <g transform="translate(72 58)">
    <rect width="68" height="68" rx="15" fill="url(#mark-background)"/>
    <path d="M20 19 34 34 20 49" fill="none" stroke="url(#terminal-stroke)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 49h14" fill="none" stroke="url(#terminal-stroke)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="160" y="88" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700">Chrome Tabs</text>
  <text x="160" y="116" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Alfred bridge</text>
  <text x="640" y="98" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" text-anchor="end">v0.1.0</text>

  <rect x="72" y="148" width="576" height="142" rx="24" fill="#fafafa" stroke="#e4e4e7" stroke-width="2"/>
  <circle cx="108" cy="190" r="16" fill="#16a34a" opacity="0.12"/>
  <circle cx="108" cy="190" r="9" fill="#16a34a"/>
  <text x="136" y="200" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700">Connected</text>
  <path d="M72 221h576" stroke="#e4e4e7" stroke-width="2"/>

  <text x="100" y="254" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="700">History search</text>
  <text x="100" y="278" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Search titles and URLs</text>
  <rect x="526" y="237" width="96" height="38" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="574" y="262" fill="#15803d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Enabled</text>

  <text x="360" y="335" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" text-anchor="middle">GitHub Repository</text>
</svg>
