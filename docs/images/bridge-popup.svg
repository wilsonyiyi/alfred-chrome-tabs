<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title description">
  <title id="title">Chrome Tabs Bridge popup</title>
  <desc id="description">The Chrome Tabs extension popup showing version 0.1.0 and a connected Native Messaging Bridge.</desc>
  <defs>
    <linearGradient id="mark-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="terminal-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="720" height="440" fill="#eef2f7"/>
  <g filter="url(#shadow)">
    <rect x="40" y="32" width="640" height="376" rx="18" fill="#ffffff"/>
  </g>

  <g transform="translate(80 72)">
    <rect width="80" height="80" rx="18" fill="url(#mark-background)"/>
    <path d="M23 23 39 40 23 57" fill="none" stroke="url(#terminal-stroke)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M43 57h16" fill="none" stroke="url(#terminal-stroke)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <text x="184" y="105" fill="#172033" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="700">Chrome Tabs</text>
  <text x="184" y="137" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">Alfred bridge</text>
  <text x="608" y="113" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" text-anchor="end">v0.1.0</text>

  <rect x="80" y="184" width="560" height="132" rx="28" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="116" cy="228" r="18" fill="#16a34a" opacity="0.12"/>
  <circle cx="116" cy="228" r="10" fill="#16a34a"/>
  <text x="144" y="238" fill="#172033" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700">Connected</text>
  <text x="104" y="282" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">Native messaging host is ready.</text>

  <text x="84" y="357" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Tab Groups bridge</text>
  <text x="636" y="357" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" text-anchor="end">Manifest V3</text>
</svg>
