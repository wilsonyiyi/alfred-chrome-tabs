name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        run: node scripts/verify-release-tag.js "$GITHUB_REF_NAME"

      - name: Build and verify release assets
        run: npm run package:release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" .release/artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" .release/artifacts/* \
              --verify-tag \
              --generate-notes \
              --title "Chrome Tabs $GITHUB_REF_NAME"
          fi
