name: CI & Release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test and build release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify release assets
        run: npm run package:release

      - name: Upload release candidates
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: .release/artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: alfred-chrome-tabs-release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize the release baseline when missing
        run: |
          version=$(node --print "require('./package.json').version")
          tag="v${version}"
          if ! git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
          fi

      - name: Analyze commits and publish when required
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release
